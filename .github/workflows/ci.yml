name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is a required status-check context in branch protection, so it
  # stays "Typecheck and unit tests" even though the job now also compiles the
  # server entry points. Renaming it silently blocks every pull request.
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Proves the production compile (tsconfig.build.json) still emits the
      # server entry points; dist/ stays gitignored and is not uploaded.
      - name: Build server entry points
        run: npm run build:server

      # MONGODB_TEST_URI is deliberately not set here, so the integration
      # suite skips and this job proves the default run is green.
      - name: Unit tests
        run: npm test

  mongodb-integration:
    name: MongoDB integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # This job is the only place MONGODB_TEST_URI is set. If this service
      # dies, the test fails loudly instead of skipping.
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/gradreach_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB
        run: |
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/27017) >/dev/null 2>&1; then
              echo "MongoDB is accepting connections on 127.0.0.1:27017."
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become reachable on 127.0.0.1:27017." >&2
          exit 1

      - name: MongoDB integration tests
        run: npm run test:mongodb
